# Development-only SearXNG instance for Local Research Agent.
#
# The published port is bound to 127.0.0.1 so the instance is not reachable
# from the network. Pin the image tag or digest for a reproducible setup; this
# example follows the upstream image so it does not go stale silently.
services:
  searxng:
    image: searxng/searxng:latest
    container_name: lra-searxng
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8080/
    restart: unless-stopped
