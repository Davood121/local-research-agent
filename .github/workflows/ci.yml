name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CMAKE_BUILD_PARALLEL_LEVEL: 1

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            bundles: msi,nsis
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-24.04
            bundles: appimage,deb

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # rust-toolchain.toml is the source of truth; rustup installs that exact
      # toolchain (and its rustfmt/clippy components) on first use.
      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            glslc \
            spirv-headers \
            libvulkan-dev

      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vulkan-sdk --yes --no-progress
          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $sdk) {
            throw 'Vulkan SDK installation did not create a version directory.'
          }
          "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV
          "$($sdk.FullName)\Bin" >> $env:GITHUB_PATH

      # CMake defaults to the multi-config "Visual Studio 17 2022" generator on
      # Windows. llama.cpp does not exercise that generator for its Vulkan
      # backend (upstream builds Vulkan with Ninja), and it fails while
      # installing the nested `vulkan-shaders-gen` tool, aborting the whole
      # native build. Ninja is single-config, so the nested ExternalProject
      # resolves $<CONFIG> the same way as the Linux and macOS builds. Ninja
      # also needs cl.exe on PATH, so import the MSVC developer environment.
      - name: Configure MSVC and Ninja
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found.' }
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vs) { throw 'Visual Studio with the MSVC C++ toolset was not found.' }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            $ninjaDir = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja'
            if (-not (Test-Path (Join-Path $ninjaDir 'ninja.exe'))) {
              throw 'Ninja was not found.'
            }
            $env:PATH = "$ninjaDir;$env:PATH"
          }
          if (-not (Get-Command cl -ErrorAction SilentlyContinue)) {
            throw 'cl.exe was not found after importing the developer environment.'
          }
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          foreach ($name in 'PATH', 'INCLUDE', 'LIB', 'LIBPATH') {
            "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }
          "cl: $((Get-Command cl).Source)"
          "ninja: $((Get-Command ninja).Source) $(& ninja --version)"

      - name: Shorten Windows Cargo build path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CARGO_TARGET_DIR=D:\t" >> $env:GITHUB_ENV

      - name: Link macOS Clang runtime
        if: runner.os == 'macOS'
        run: |
          clang_runtime="$(xcrun clang --print-resource-dir)/lib/darwin/libclang_rt.osx.a"
          if [[ ! -f "$clang_runtime" ]]; then
            echo "::error::Clang runtime archive not found: $clang_runtime"
            exit 1
          fi
          echo "RUSTFLAGS=-C link-arg=$clang_runtime" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        if: runner.os != 'Windows'
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The native llama.cpp build can abort without printing the failing
      # command, so keep a copy of the output and republish its tail as an
      # annotation (see the next step) where it is always readable.
      - name: Clippy (deny warnings)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'clippy.log'
          cargo clippy --all-targets -- -D warnings 2>&1 | Tee-Object -FilePath $log
          exit $LASTEXITCODE

      - name: Report native build output
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'clippy.log'
          if (-not (Test-Path $log)) {
            Write-Host 'No clippy log was captured.'
            exit 0
          }
          $tail = @(Get-Content $log -Tail 40 | ForEach-Object { $_ -replace '%', '%25' -replace "`r", '' })
          if ($tail.Count -eq 0) { exit 0 }
          Write-Host '--- last 40 lines of clippy output ---'
          $tail
          "::error title=Clippy and native build output::$($tail -join '%0A')"

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Lint frontend
        run: npm run lint

      - name: Check frontend formatting
        run: npm run format:check

      - name: Build frontend
        run: npm run build

      # Full release bundles (not debug) so the installer-size and release
      # profile acceptance criteria are exercised on every OS.
      - name: Build Tauri bundles
        run: npm run tauri:build -- --ci --bundles ${{ matrix.bundles }}

      # The Windows build redirects Cargo to D:\t (a short path for MSVC), which
      # is outside the workspace. upload-artifact refuses files outside the
      # workspace root, so stage the bundles inside it first.
      - name: Stage Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installers | Out-Null
          $bundles = Get-ChildItem -File -ErrorAction SilentlyContinue -Path @(
            'D:\t\release\bundle\msi\*.msi',
            'D:\t\release\bundle\nsis\*.exe'
          )
          if (-not $bundles) {
            throw 'No MSI or NSIS bundles were found under D:\t\release\bundle.'
          }
          $bundles | Copy-Item -Destination installers -Force
          $bundles | ForEach-Object {
            "staged: $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MiB)"
          }

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            installers/*.msi
            installers/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find installers -maxdepth 3 -type f -print0)
          if ((${#assets[@]} == 0)); then
            echo "::error::No installer packages were downloaded."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
